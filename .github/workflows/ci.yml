name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check-and-test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache cargo dependencies and target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Repository suppression audit
        shell: bash
        run: |
          if rg -n -U '#!?\[allow\([\s\S]{0,180}?\)\]|#!\[allow\(' src tests benches Cargo.toml 2>/dev/null; then
            echo "Forbidden warning suppression found"
            exit 1
          fi

      - name: Cargo check
        run: cargo check --all-targets --all-features

      - name: Clippy check (0 warnings policy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run all test suites
        run: cargo test --all-targets --all-features

      - name: Run benchmark harness (compile & test execution)
        run: cargo bench --no-run

      - name: Isolated benchmark smoke
        run: cargo bench --bench performance -- --stage clean_build --scale Small
        env:
          GRAPHIA_RUN_BENCH: "1"
