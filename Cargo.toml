[package]
name = "graphia"
version = "0.1.0"
edition = "2024"
description = "Native low-level code graph engine"
license = "MIT"
rust-version = "1.85"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "=0.23.0"
tree-sitter-kotlin = { version = "1.1", package = "tree-sitter-kotlin-ng" }
tree-sitter-php = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-zig = "1.1.2"
tree-sitter-swift = "=0.6.0"
notify = "8.0"
ctrlc = "3.4"

[dev-dependencies]
tempfile = "3.10"

[[bench]]
name = "performance"
harness = false

[lints.rust]
warnings = "deny"

[lints.clippy]
correctness = "deny"
suspicious = "deny"
complexity = "warn"
perf = "warn"
style = "warn"
