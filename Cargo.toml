[package]
name = "graphia"
version = "0.1.0"
edition = "2024"
description = "Native low-level code graph engine"
license = "MIT"
rust-version = "1.85"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile = "3.10"

[[bench]]
name = "m05"
harness = false

[lints.rust]
warnings = "deny"
missing_docs = "allow"

[lints.clippy]
correctness = "deny"
suspicious = "deny"
complexity = "warn"
perf = "warn"
style = "warn"
